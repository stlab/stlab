# Welcome to Jekyll!
#
# This config file is meant for settings that affect your whole blog, values
# which you are expected to set up once and rarely need to edit after that.
# For technical reasons, this file is *NOT* reloaded automatically when you use
# 'jekyll serve'. If you change this file, please restart the server process.

# Site settings
title: stlab
subtitle: modern, modular C++ algorithms and data structures.
email: sean.parent@stlab.cc
description: > # this means to ignore newlines until "baseurl:"
  stlab hosts modern, modular C++ algorithms and data structures.
baseurl: "" # the subpath of your site, e.g. /blog
url: "http://www.stlab.cc" # the base hostname & protocol for your site
twitter_username: SeanParent
github_username: stlab

## [local-theme] To build locally, toggle these two lines
remote_theme: adobe/hyde-theme@v3.0.0
#theme: jekyll-theme-adobe-hyde

# Required by hyde-theme SCSS: root.scss uses map.merge(header map, $theme-vars).
# Without header_image, Sass fails with "Expected $args to contain a key".
adobe_hyde:
  header_image: stlab-logo-long.svg

exclude:
  - _source
  - Doxyfile.in
  - Doxyfile.stlab
  # Doxyfile INPUT only (stlab_groups.hpp); API HTML is merged into _site/doxygen/ by build-site.sh
  - doxygen
  - build
  - boost # from building examples
  - boost.tgz # from building examples
  - "*.sh"
  - README.md
  - DOCUMENTATION.md
  - REMAINING_HYDE_MIGRATION_PLAN.md
  - hyde_source_inventory.md
  - include/README.md
  - stlab.bbprojectd/
  - vendor # For Travis-CI (see https://jekyllrb.com/docs/continuous-integration/)
  - tools/
  - bs-config.sj
  - CMakeLists.txt
  - Gemfile
  - Gemfile.lock
# Preserved across jekyll build --watch cleans (API HTML copied by build-site.sh / sync-doxygen.sh)
keep_files:
  - doxygen

excerpt_separator: <!--more-->
markdown: kramdown
utterances:
  repo: stlab/stlab.github.io
  label: "utterance"
plugins:
  - jekyll-redirect-from
  - jekyll-remote-theme
