name: Build and Tests

on:
  pull_request:
  push:
    branches:
      - main

# Development SHAs are remotely reachable for CI; approved release pins remain
# publication gates in the toolkit -> execution -> STLab sequence.
jobs:
  generate-matrix:
    name: Generate job matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1

      - name: Generate job matrix
        id: set-matrix
        # Note: The json in this variable must be a single line for parsing to succeed.
        run: echo "matrix=$(cat .github/matrix.json | scripts/flatten_json.py)" >> $GITHUB_OUTPUT

  builds:
    # installed tools and runners can be found here: https://github.com/actions/runner-images
    needs: generate-matrix
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix: ${{fromJson(needs.generate-matrix.outputs.matrix)}}
    name: ${{ matrix.config.name }}

    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1

      - name: Install dependencies // Linux Emscripten
        if: ${{ startsWith(matrix.config.compiler, 'emscripten') }}
        shell: bash
        # [DEPENDENCY] https://github.com/emscripten-core/emscripten/releases
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git $HOME/emsdk
          pushd $HOME/emsdk
          ./emsdk install 6.0.11
          ./emsdk activate 6.0.11
          echo 'source "$HOME/emsdk/emsdk_env.sh"' >> $HOME/.bash_profile
          popd

      - name: Install dependencies // Linux Qt6
        if: ${{ matrix.config.qt == 'qt6' }}
        shell: bash
        # [DEPENDENCY] https://packages.ubuntu.com/search?keywords=qt6-base-dev
        run: |
          sudo apt-get update
          sudo apt-get install -y qt6-base-dev

      - name: Set enviroment variables // Linux GCC
        if: ${{ matrix.config.compiler == 'gcc' }}
        shell: bash
        run: |
          echo "CC=gcc" >> $GITHUB_ENV
          echo "CXX=g++" >> $GITHUB_ENV

      - name: Set enviroment variables // Linux Clang
        if: ${{ matrix.config.compiler == 'clang' }}
        shell: bash
        run: |
          echo "CC=clang" >> $GITHUB_ENV
          echo "CXX=clang++" >> $GITHUB_ENV

      - name: Configure // Unix !Emscripten
        if: ${{ (startsWith(matrix.config.os, 'ubuntu') || startsWith(matrix.config.os, 'macos')) && !startsWith(matrix.config.compiler, 'emscripten') }}
        shell: bash
        run: |
          mkdir ../build
          cmake -S. -B../build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=${{ matrix.config.standard || '20' }} ${{ matrix.config.cmake_options }}

      - name: Configure // Linux Emscripten
        if: ${{ startsWith(matrix.config.compiler, 'emscripten') }}
        shell: bash -l {0}
        run: |
          mkdir ../build
          cmake -S. -B../build -GNinja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23 \
            -DCMAKE_TOOLCHAIN_FILE=$GITHUB_WORKSPACE/cmake/Platform/Emscripten-STLab.cmake \
            ${{ matrix.config.cmake_options }}

      - name: Setup MSVC
        if: ${{ startsWith(matrix.config.os, 'windows') }}  
        # [DEPENDENCY] https://github.com/TheMrMilchmann/setup-msvc-dev/releases
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64

      - name: Configure // Windows
        if: ${{ startsWith(matrix.config.os, 'windows') }}
        run: |
          mkdir ..\build
          cmake -S. -B../build -GNinja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_STANDARD=20 ${{ matrix.config.cmake_options }}

      - name: Build // Unix
        if: ${{ startsWith(matrix.config.os, 'ubuntu') || startsWith(matrix.config.os, 'macos') }}
        shell: bash -l {0}
        run: |
          cmake --build ../build/ ${{ matrix.config.build_options }}

      - name: Build // Windows
        if: ${{ startsWith(matrix.config.os, 'windows') }}
        run: |
          cmake --build ../build/

      - name: Test
        shell: bash -l {0}
        run: |
          cd ../build/
          ctest --output-on-failure --verbose ${{ matrix.config.ctest_options }}

  macos-tsan:
    name: macOS TSan
    runs-on: macos-latest
    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake --preset debug-sanitizer

      - name: Build
        run: cmake --build build/debug-sanitizer

      - name: Test
        run: |
          cd build/debug-sanitizer
          ctest --output-on-failure --verbose

  packages:
    name: Installed/source consumers (${{ matrix.os }}, ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: test-packages
          - os: windows-latest
            preset: test-packages
          - os: windows-latest
            preset: test-packages-shared
          - os: windows-latest
            preset: test-packages-portable-shared
    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1
      - if: ${{ startsWith(matrix.os, 'windows') }}
        # [DEPENDENCY] https://github.com/TheMrMilchmann/setup-msvc-dev/releases
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: x64
      - run: cmake --preset=${{ matrix.preset }}
      - run: ctest --preset=${{ matrix.preset }}

  macos-tsan-portable:
    name: macOS TSan (portable)
    runs-on: macos-latest
    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1

      - name: Configure
        run: cmake --preset debug-portable-sanitizer

      - name: Build
        run: cmake --build build/debug-portable-sanitizer

      - name: Test
        run: |
          cd build/debug-portable-sanitizer
          ctest --output-on-failure --verbose

  doxygen:
    name: Doxygen API docs
    runs-on: ubuntu-latest
    steps:
      # [DEPENDENCY] https://github.com/actions/checkout/releases
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Install Doxygen
        # [DEPENDENCY] https://github.com/ssciwr/doxygen-install/releases (v2.0.3)
        uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758

      - name: Configure
        run: cmake --preset=docs

      - name: Build documentation
        run: cmake --build --preset=docs

      - name: Upload HTML artifact
        # [DEPENDENCY] https://github.com/actions/upload-artifact/releases
        uses: actions/upload-artifact@v7.0.1
        with:
          name: doxygen-html
          path: build/docs/html
