# Build Jekyll site + Doxygen API docs and deploy to GitHub Pages (stlab.cc).

name: Deploy Jekyll site to Pages

env:
  source: ./docs/

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # [DEPENDENCY] https://github.com/actions/checkout/releases
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Setup Ruby
        # [DEPENDENCY] https://github.com/ruby/setup-ruby/releases
        uses: ruby/setup-ruby@v1.327.0
        with:
          # [DEPENDENCY] https://www.ruby-lang.org/en/downloads/
          ruby-version: '4.0.7'
          working-directory: docs
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        # [DEPENDENCY] https://github.com/actions/configure-pages/releases
        uses: actions/configure-pages@v6.0.0
      - name: Install Doxygen
        # [DEPENDENCY] https://github.com/ssciwr/doxygen-install/releases (v2.0.3)
        uses: ssciwr/doxygen-install@fa3e94d34131d3990b6b8ba939ab982964aa3758
      - name: Build full documentation site
        run: bash ./docs/tools/docs/build-site.sh --refresh-releases
        env:
          JEKYLL_BASEURL: ${{ steps.pages.outputs.base_path }}
          JEKYLL_ENV: production
      - name: Upload artifact
        # [DEPENDENCY] https://github.com/actions/upload-pages-artifact/releases
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./docs/_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        # [DEPENDENCY] https://github.com/actions/deploy-pages/releases
        uses: actions/deploy-pages@v5.0.1
